<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workplace AI — Livelihood Intelligence &amp; Trust Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F6F5F1;
  --surface:#FFFFFF;
  --surface-2:#EFEDE6;
  --ink:#12201D;
  --ink-soft:#5B665F;
  --ink-faint:#8B958E;
  --border:#E2DFD3;
  --teal-900:#0B332D;
  --teal-800:#0F433B;
  --teal-700:#15574C;
  --teal-600:#1B6E5F;
  --teal-500:#218774;
  --teal-100:#DCEEE8;
  --gold-600:#9C7A24;
  --gold-500:#C79A34;
  --gold-100:#F5E9CB;
  --coral-600:#B54A2E;
  --coral-500:#D8613C;
  --coral-100:#F7E2D7;
  --sky-500:#3E77A6;
  --sky-100:#DDEAF3;
  --radius-sm:6px;
  --radius-md:12px;
  --radius-lg:20px;
  --shadow-1: 0 1px 2px rgba(18,32,29,0.06), 0 1px 1px rgba(18,32,29,0.04);
  --shadow-2: 0 8px 24px -8px rgba(18,32,29,0.18);
  color-scheme: light;
}
:root:not([data-theme="light"]) { }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613;
    --surface:#16211D;
    --surface-2:#1C2925;
    --ink:#EDF2EF;
    --ink-soft:#AAB6AF;
    --ink-faint:#748079;
    --border:#293833;
    --teal-100:#173A32;
    --gold-100:#3A2E12;
    --coral-100:#3A2216;
    --sky-100:#152C3A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1613;
  --surface:#16211D;
  --surface-2:#1C2925;
  --ink:#EDF2EF;
  --ink-soft:#AAB6AF;
  --ink-faint:#748079;
  --border:#293833;
  --teal-100:#173A32;
  --gold-100:#3A2E12;
  --coral-100:#3A2216;
  --sky-100:#152C3A;
  color-scheme: dark;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); scroll-behavior:smooth;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,.display{font-family:'Fraunces',serif; letter-spacing:-0.01em;}
.mono{font-family:'JetBrains Mono',monospace;}
::selection{background:var(--gold-100); color:var(--teal-900);}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
.scrollx{overflow-x:auto; -webkit-overflow-scrolling:touch;}
.scrollx::-webkit-scrollbar{height:6px;}
.scrollx::-webkit-scrollbar-thumb{background:var(--border); border-radius:99px;}

/* ---- layout shells ---- */
#app{min-height:100%;}
.wrap{max-width:1180px; margin:0 auto; padding:0 20px;}
.wrap-narrow{max-width:760px; margin:0 auto; padding:0 20px;}

/* ---- topbar ---- */
.topbar{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding-top:env(safe-area-inset-top,0px);
}
.topbar-inner{display:flex; align-items:center; justify-content:space-between; height:64px; gap:12px;}
.brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px;}
.brand .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(155deg,var(--teal-600),var(--teal-900)); display:flex;align-items:center;justify-content:center; color:var(--gold-100); font-family:'Fraunces',serif; font-weight:600; font-size:16px; flex:none;}
.demo-banner{background:var(--gold-500); color:#231A03; font-size:12.5px; font-weight:700; text-align:center; padding:6px 10px; letter-spacing:0.01em;}

/* ---- buttons ---- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:99px; padding:11px 20px; font-weight:600; font-size:14.5px; border:1px solid transparent; transition:transform .12s ease, background .15s ease; white-space:nowrap;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--teal-800); color:#F3FAF7;}
.btn-primary:hover{background:var(--teal-900);}
.btn-gold{background:var(--gold-500); color:#231A03;}
.btn-gold:hover{background:var(--gold-600); color:#fff;}
.btn-outline{background:transparent; border-color:var(--border); color:var(--ink);}
.btn-outline:hover{border-color:var(--ink-faint);}
.btn-ghost{background:transparent; color:var(--ink-soft); padding:8px 12px;}
.btn-ghost:hover{color:var(--ink);}
.btn-sm{padding:7px 14px; font-size:13px;}
.btn-block{width:100%;}
.btn-coral{background:var(--coral-600); color:#fff;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

/* ---- cards ---- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow-1);}
.card-pad{padding:20px;}
.section-title{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);}
.eyebrow{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--teal-700); background:var(--teal-100); padding:5px 11px; border-radius:99px;}

/* ---- status pills ---- */
.pill{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; padding:4px 10px; border-radius:99px;}
.pill-verified{background:var(--teal-100); color:var(--teal-800);}
.pill-assessed{background:var(--gold-100); color:var(--gold-600);}
.pill-claimed{background:var(--surface-2); color:var(--ink-soft);}
.pill-warn{background:var(--coral-100); color:var(--coral-600);}
.pill-info{background:var(--sky-100); color:var(--sky-500);}

/* ---- skill dot ---- */
.dot{width:11px;height:11px;border-radius:50%; flex:none; border:2px solid transparent;}
.dot-verified{background:var(--teal-600);}
.dot-assessed{background:var(--gold-500);}
.dot-claimed{background:transparent; border-color:var(--ink-faint);}

/* ---- modal ---- */
.modal-backdrop{position:fixed; inset:0; background:rgba(11,20,18,0.55); z-index:80; display:flex; align-items:flex-end; justify-content:center; padding:0;}
@media(min-width:720px){.modal-backdrop{align-items:center; padding:24px;}}
.modal-panel{background:var(--bg); width:100%; max-width:640px; max-height:92vh; overflow-y:auto; border-radius:20px 20px 0 0; box-shadow:var(--shadow-2); animation:slideup .28s cubic-bezier(.2,.9,.3,1);}
@media(min-width:720px){.modal-panel{border-radius:20px; max-height:88vh;}}
@keyframes slideup{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal-head{position:sticky; top:0; background:var(--bg); z-index:5; display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border);}

/* ---- progress ---- */
.progress-track{width:100%; height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--teal-600),var(--teal-500)); border-radius:99px; transition:width .5s ease;}

/* ---- lifecycle rail ---- */
.rail{display:flex; align-items:center; gap:0; margin:6px 0 4px;}
.rail-step{width:24px;height:24px;border-radius:50%; background:var(--surface-2); border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--ink-faint); flex:none; transition:all .25s ease;}
.rail-step.done{background:var(--teal-700); border-color:var(--teal-700); color:#fff;}
.rail-step.active{background:var(--gold-500); border-color:var(--gold-500); color:#231A03; box-shadow:0 0 0 4px var(--gold-100);}
.rail-line{flex:1; height:2px; background:var(--border); min-width:8px;}
.rail-line.done{background:var(--teal-600);}

/* ---- nav ---- */
.tabbar{display:flex; gap:6px; overflow-x:auto; padding:4px 0 2px;}
.tabbar::-webkit-scrollbar{display:none;}
.tab{padding:8px 16px; border-radius:99px; font-size:13.5px; font-weight:600; color:var(--ink-soft); border:1px solid var(--border); background:var(--surface); white-space:nowrap; flex:none;}
.tab.active{background:var(--teal-800); color:#fff; border-color:var(--teal-800);}

/* ---- misc ---- */
.fade-in{animation:fadein .35s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.divider{height:1px; background:var(--border); margin:16px 0;}
.avatar{width:52px;height:52px;border-radius:14px; background:linear-gradient(155deg,var(--teal-600),var(--teal-900)); display:flex; align-items:center; justify-content:center; color:var(--gold-100); font-weight:700; font-size:18px; flex:none; font-family:'Fraunces',serif;}
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--teal-900); color:#fff; padding:13px 20px; border-radius:99px; font-size:14px; font-weight:600; z-index:200; box-shadow:var(--shadow-2); display:flex; align-items:center; gap:8px; animation:toastin .25s ease;}
@keyframes toastin{from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);}}
.grid-auto{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px;}
.kpi{padding:16px; border-radius:14px; background:var(--surface); border:1px solid var(--border);}
.kpi .num{font-family:'Fraunces',serif; font-size:26px; font-weight:600;}
.skillnode{border:1px solid var(--border); border-radius:12px; padding:12px 14px; background:var(--surface); display:flex; align-items:center; gap:10px; cursor:pointer; transition:border-color .15s;}
.skillnode:hover{border-color:var(--teal-500);}
.chip{font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:99px;}
.map-wrap{position:relative; background:radial-gradient(circle at 30% 20%, var(--teal-100), var(--surface-2)); border-radius:16px; height:260px; overflow:hidden; border:1px solid var(--border);}
.map-dot{position:absolute; width:10px; height:10px; border-radius:50%; background:var(--sky-500);}
.map-worker{position:absolute; width:14px; height:14px; border-radius:50%; background:var(--teal-600); border:2px solid #fff; box-shadow:0 0 0 3px var(--teal-100);}
.map-hub{position:absolute; font-size:20px;}
.link-btn{background:none;border:none;color:var(--teal-700); font-weight:600; font-size:13.5px; padding:0;}
.badge-count{background:var(--coral-600); color:#fff; font-size:10.5px; font-weight:700; border-radius:99px; padding:1px 6px; min-width:16px; text-align:center;}
input[type=radio]{accent-color:var(--teal-700);}
.mcq-opt{display:flex; gap:10px; align-items:flex-start; border:1px solid var(--border); border-radius:10px; padding:11px 13px; margin-bottom:8px; cursor:pointer;}
.mcq-opt.picked{border-color:var(--teal-600); background:var(--teal-100);}
.mcq-opt.correct{border-color:var(--teal-600); background:var(--teal-100);}
.mcq-opt.wrong{border-color:var(--coral-500); background:var(--coral-100);}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-root"></div>

<script>
/* =========================================================================
   WORKPLACE AI — demo-ready interactive prototype
   Single-file, client-only. All "backend" behaviour is simulated in JS
   state so every button genuinely changes something and the golden demo
   path (voice -> skillgraph -> passport -> opportunity -> match -> pay ->
   proof -> mobility -> mission) actually runs end to end.
   ========================================================================= */

const ICONS = {
  verified: '✓', assessed: '◐', claimed: '○'
};

function freshData(){
  return {
    worker: {
      name:'Arun Kumar',
      title:'Rural Electrical & Pump Technician',
      language:'Tamil',
      experience:'5 Years',
      location:'Demo Rural Block',
      radius:15,
      availability:'Available',
      skills:{
        'Electrical Wiring':'verified',
        'Fan Installation':'verified',
        'Pump Repair':'claimed',
        'Motor Repair':'claimed',
        'Solar Pump Maintenance':'claimed'
      },
      stats:{completedJobs:24, avgRating:4.7, avgDuration:'2.8 hrs', jobsThisMonth:8, monthlyEarnings:18500, learningProgress:35, proofOfWork:18},
      onboarded:false
    },
    customer:{ name:'Ravi Agricultural Services', location:'Demo Rural Block', verified:true },
    job:{
      title:'Solar Pump Repair',
      location:'Demo Rural Block',
      distance:4.2,
      duration:'2–3 hours',
      skillsRequired:['Pump Repair','Electrical Wiring'],
      priceMin:700, priceMax:1100, agreedPrice:900,
      posted:true,
      stage:0, // 0 open,1 accepted,2 trust-reviewed,3 started,4 checked-in,5 live,6 completed,7 customer-confirmed,8 paid,9 proof,10 passport-updated
    },
    mission:{
      name:'Rural Water-Pump Inspection Drive',
      location:'Demo Rural Block',
      households:120,
      workersRequired:12,
      workersAssigned:8,
      tasksDone:46,
      status:'IN PROGRESS',
      team:[
        {name:'Arun Kumar', skill:'Pump Repair', rating:4.7, status:'Assessed'},
        {name:'Priya', skill:'Electrical Maintenance', rating:4.5, status:'Verified'},
        {name:'Suresh', skill:'Motor Repair', rating:4.3, status:'Claimed'},
        {name:'Karthik', skill:'Solar Technician', rating:4.6, status:'Verified'},
      ]
    },
    learning:{ progress:35, modulesDone:2, modulesTotal:5 },
    assessment:{ done:false, score:null },
    notifications:[
      {t:'New opportunity signal: Solar Pump Maintenance demand rising nearby', time:'2h ago'},
      {t:'Payment of ₹1,200 received for Fan Installation job', time:'1d ago'},
      {t:'Mission "Water-Pump Inspection Drive" needs 4 more workers', time:'2d ago'},
    ],
    audit:[
      {t:'Worker Arun Kumar completed voice onboarding', time:'09:02'},
      {t:'Skill "Pump Repair" moved CLAIMED → ASSESSED', time:'09:14'},
      {t:'Customer Ravi Agricultural Services posted job "Solar Pump Repair"', time:'10:03'},
      {t:'System flagged TrustShield review: first-time customer', time:'10:04'},
    ]
  };
}

const state = {
  screen:'landing',       // landing | demoSelect | worker | customer | mission | admin
  modal:null,             // current open modal name
  data: freshData(),
  guidedOpen:false,
  guidedStep:0,
};

function fmtINR(n){ return '₹' + n.toLocaleString('en-IN'); }

function toast(msg){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2400);
}

/* ---------------------------- App controller ---------------------------- */
const app = {

  goto(screen){ state.screen=screen; state.modal=null; render(); window.scrollTo({top:0}); },
  open(modal){ state.modal=modal; render(); },
  close(){ state.modal=null; render(); },

  enterDemo(role){
    state.screen = role;
    state.modal = null;
    render();
    window.scrollTo({top:0});
  },

  resetDemo(){
    state.data = freshData();
    state.modal = null;
    toast('🔄 Demo reset — replay the journey any time.');
    render();
  },

  toggleTheme(){
    const root = document.documentElement;
    const cur = root.getAttribute('data-theme');
    if(cur==='dark'){ root.setAttribute('data-theme','light'); }
    else if(cur==='light'){ root.removeAttribute('data-theme'); }
    else { root.setAttribute('data-theme','dark'); }
  },

  /* ---- voice onboarding ---- */
  voiceState:'idle', // idle -> transcribed -> extracted -> confirmed
  useDemoVoice(){
    app.voiceState='transcribed';
    render();
    setTimeout(()=>{ app.voiceState='extracted'; render(); }, 900);
  },
  confirmExtraction(){
    state.data.worker.onboarded = true;
    app.voiceState='confirmed';
    state.data.audit.unshift({t:'Worker confirmed AI skill extraction (Electrical Wiring, Pump Repair)', time:'now'});
    toast('✓ Skills confirmed — SkillGraph updated');
    render();
  },

  /* ---- assessment ---- */
  mcqAnswers:{},
  pickMcq(qIdx, optIdx){
    app.mcqAnswers[qIdx]=optIdx;
    render();
  },
  submitAssessment(){
    const correct=[1,2,0,3,1];
    let score=0;
    correct.forEach((c,i)=>{ if(app.mcqAnswers[i]===c) score++; });
    if(score < 3) score = 4; // keep demo deterministic/positive
    state.data.assessment.done = true;
    state.data.assessment.score = score;
    state.data.worker.skills['Pump Repair']='assessed';
    state.data.audit.unshift({t:'Skill "Pump Repair" moved CLAIMED → ASSESSED (score '+score+'/5)', time:'now'});
    toast('✓ Assessment complete — Pump Repair is now ASSESSED');
    render();
  },
  retakeAssessment(){ app.mcqAnswers={}; state.data.assessment.done=false; render(); },

  /* ---- job lifecycle ---- */
  advanceJob(){
    const j = state.data.job;
    if(j.stage < 10) j.stage++;
    const notes = {
      1:'Job accepted by Arun Kumar', 2:'TrustShield review completed',
      3:'Job started', 4:'Worker checked in on-site', 5:'Live status shared with customer',
      6:'Job marked complete by worker', 7:'Customer confirmed completion',
      8:'Payment of '+fmtINR(j.agreedPrice)+' settled (sandbox)', 9:'Proof of Work record generated',
      10:'Passport updated — Pump Repair ASSESSED → VERIFIED'
    };
    if(notes[j.stage]) state.data.audit.unshift({t:notes[j.stage], time:'now'});
    if(j.stage===9){
      state.data.worker.skills['Pump Repair']='verified';
      state.data.worker.stats.proofOfWork++;
    }
    if(j.stage===10){
      state.data.worker.stats.completedJobs++;
      state.data.worker.stats.monthlyEarnings += j.agreedPrice;
    }
    render();
  },
  resetJobStage(){ state.data.job.stage=0; render(); },

  /* ---- learning ---- */
  advanceLearning(){
    const l = state.data.learning;
    if(l.modulesDone < l.modulesTotal){ l.modulesDone++; l.progress = Math.round(l.modulesDone/l.modulesTotal*100); }
    state.data.worker.stats.learningProgress = l.progress;
    if(l.modulesDone===l.modulesTotal) toast('🎓 Learning complete — skill readiness improved');
    render();
  },

  /* ---- mission ---- */
  assignWorker(){
    const m = state.data.mission;
    if(m.workersAssigned < m.workersRequired){ m.workersAssigned++; m.tasksDone = Math.min(m.households, m.tasksDone+6); }
    render();
  },

  /* ---- guided demo ---- */
  openGuided(){ state.guidedOpen=true; render(); },
  closeGuided(){ state.guidedOpen=false; render(); },
  guidedGo(i){
    state.guidedStep=i;
    const steps = GUIDED_STEPS;
    steps[i].action();
    render();
  },
};

/* Guided demo script -> 13 steps from the brief */
const GUIDED_STEPS = [
  {label:'Meet Arun', action:()=>{ state.screen='worker'; state.modal=null; }},
  {label:'Discover his skills', action:()=>{ state.screen='worker'; state.modal='voice'; app.voiceState='idle'; }},
  {label:'Build his AI Passport', action:()=>{ state.screen='worker'; state.modal='passport'; }},
  {label:'Verify Pump Repair', action:()=>{ state.screen='worker'; state.modal='assessment'; }},
  {label:'Detect Solar Pump opportunity', action:()=>{ state.screen='worker'; state.modal='radar'; }},
  {label:'Match a job', action:()=>{ state.screen='worker'; state.modal='job'; }},
  {label:'Calculate FairPay', action:()=>{ state.screen='worker'; state.modal='job'; state.jobTab='fairpay'; }},
  {label:'Review TrustShield', action:()=>{ state.screen='worker'; state.modal='job'; state.jobTab='trust'; if(state.data.job.stage<1) state.data.job.stage=1; }},
  {label:'Complete the job', action:()=>{ state.screen='worker'; state.modal='job'; state.jobTab='lifecycle'; state.data.job.stage=6; }},
  {label:'Generate Proof of Work', action:()=>{ state.data.job.stage=9; state.screen='worker'; state.modal='job'; state.jobTab='lifecycle'; }},
  {label:'Recommend learning', action:()=>{ state.screen='worker'; state.modal='mobility'; }},
  {label:'Unlock better opportunity', action:()=>{ state.screen='worker'; state.modal='mobility'; }},
  {label:'Show Mission Mode', action:()=>{ state.screen='mission'; state.modal=null; }},
];

/* ============================== RENDERING =============================== */

function render(){
  const root = document.getElementById('app');
  let html = '';
  if(state.screen==='landing') html = viewLanding();
  else if(state.screen==='demoSelect') html = viewDemoSelect();
  else html = viewShell();
  root.innerHTML = html;

  if(state.modal){
    const wrap = document.createElement('div');
    wrap.innerHTML = modalHTML(state.modal);
    root.appendChild(wrap.firstElementChild);
  }
  if(state.guidedOpen){
    const wrap = document.createElement('div');
    wrap.innerHTML = guidedPanelHTML();
    root.appendChild(wrap.firstElementChild);
  }
  if(state.screen==='admin'){
    setTimeout(initAdminCharts, 20);
  }
}

/* ---------------------------- Landing page ---------------------------- */
function viewLanding(){
  return `
  <div class="fade-in">
    <div class="topbar"><div class="wrap topbar-inner">
      <div class="brand"><div class="mark">W</div> Workplace AI</div>
      <div style="display:flex; gap:8px; align-items:center;">
        <button class="btn btn-ghost" onclick="app.toggleTheme()" title="Toggle theme">◐</button>
        <button class="btn btn-outline btn-sm" onclick="app.goto('demoSelect')">🎮 Try Demo</button>
      </div>
    </div></div>

    <div class="wrap" style="padding-top:56px; padding-bottom:40px;">
      <div class="eyebrow">Livelihood Intelligence &amp; Trust Network</div>
      <h1 class="display" style="font-size:clamp(32px,6vw,58px); font-weight:600; line-height:1.05; margin:18px 0 16px; max-width:820px;">
        Turn skills into trusted opportunities.
      </h1>
      <p style="font-size:18px; color:var(--ink-soft); max-width:560px; line-height:1.55;">
        Discover skills, verify experience, find local work, stay safer, prove your work, and grow your income — one connected system for informal and underserved workers.
      </p>

  });
  chartSkillsRef = new Chart(c2, {
    type:'doughnut',
    data:{ labels:['Verified','Assessed','Claimed'], datasets:[{ data:[687,214,140], backgroundColor:['#218774','#C79A34','#B8C0BA'] }]},

          ${status==='verified' ? `<div>• Customer-confirmed job with proof of work</div><div>• 4.7★ average across related jobs</div>` : ''}
          ${status==='assessed' ? `<div>• Passed skill assessment (4/5)</div><div>• Awaiting a verified job to upgrade status</div>` : ''}
          ${status==='claimed' ? `<div>• Self-reported during voice onboarding</div><div>• No assessment or job evidence yet</div>` : ''}
        </div>
        ${status==='claimed' && focus==='Motor Repair' ? `<button class="btn btn-outline btn-block" onclick="app.close()">Assessment coming soon in this demo</button>` : ''}
      </div>
    </div></div>`;
  }
  return origModalHTML(name);
};

/* ================================ INIT ================================ */
render();
</script>
</body>
</html>
